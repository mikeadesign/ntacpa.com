<!-- @dsCard group="Components" viewport="700x290" subtitle="Button, Input, Card, Badge, PullQuote" name="Core" --><!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;background:var(--nta-white);font-family:var(--font-text)}.w{padding:22px 26px;display:flex;flex-direction:column;gap:16px}.row{display:flex;gap:14px;align-items:center}.lbl{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--nta-muted-light);text-transform:uppercase;white-space:nowrap}.mono{font-size:10px;color:var(--nta-muted)}.mk{position:relative;background:var(--nta-navy);display:flex;align-items:center;justify-content:center;flex:0 0 auto}.mk span{font-family:var(--font-display);font-weight:700;color:#fff;line-height:1}.t1,.t2{position:absolute}.desc{font-weight:600;letter-spacing:var(--track-descriptor);white-space:nowrap}.nm{font-weight:500;letter-spacing:var(--track-name);white-space:nowrap;color:var(--nta-muted)}.wm{font-family:var(--font-display);font-weight:600;letter-spacing:var(--track-wordmark);color:var(--nta-navy);line-height:1;white-space:nowrap}</style></head><body><div class="w"><div class="row" style="gap:10px;flex-wrap:wrap"><button style="font-family:var(--font-text);font-weight:600;letter-spacing:.3px;padding:11px 22px;font-size:14px;background:var(--nta-navy);color:#fff;border:1px solid var(--nta-navy);border-radius:0">Primary</button><button style="font-family:var(--font-text);font-weight:600;letter-spacing:.3px;padding:11px 22px;font-size:14px;background:transparent;color:var(--nta-navy);border:1px solid var(--nta-navy);border-radius:0">Secondary</button><button style="font-family:var(--font-text);font-weight:600;letter-spacing:.3px;padding:11px 22px;font-size:14px;background:transparent;color:var(--nta-slate);border:1px solid transparent;border-radius:0">Ghost</button><span style="display:inline-flex;font-size:12px;font-weight:600;letter-spacing:1.5px;padding:5px 11px;background:var(--nta-navy);color:#fff">CPA</span><span style="display:inline-flex;font-size:12px;font-weight:600;letter-spacing:1.5px;padding:5px 11px;background:rgba(201,162,74,.14);color:var(--nta-gold-deep);border:1px solid rgba(201,162,74,.5)">SINCE 1983</span></div><div class="row" style="gap:16px;align-items:flex-start"><div style="display:flex;flex-direction:column;gap:7px;flex:1"><span class="lbl" style="color:var(--nta-navy)">Email</span><input placeholder="you@example.com" style="font-family:var(--font-text);font-size:14px;color:var(--nta-body);padding:11px 13px;border:1px solid var(--border-cool);border-radius:0;outline:none"></div><div style="flex:1;background:var(--nta-white);border:1px solid var(--nta-line);border-top:3px solid var(--nta-gold);padding:16px 18px"><div style="font-size:13px;font-weight:700;color:var(--nta-navy);margin-bottom:6px">Card · accent</div><div class="mono" style="line-height:1.55">Sits on tone or a hairline, not a shadow.</div></div></div><blockquote style="margin:0;border-left:3px solid var(--nta-gold);padding-left:18px"><span style="font-family:var(--font-display);font-weight:500;font-style:italic;font-size:19px;color:var(--nta-navy);line-height:1.3">Where regulatory expertise meets personal service.</span></blockquote></div></body></html>
