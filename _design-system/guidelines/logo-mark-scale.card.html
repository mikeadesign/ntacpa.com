<!-- @dsCard group="Brand" viewport="700x190" subtitle="Ticks thin at 48px, drop at 32px, single N at 16px" name="Logo · degradation" --><!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;background:var(--nta-white);font-family:var(--font-text)}.w{padding:22px 26px;display:flex;flex-direction:column;gap:16px}.row{display:flex;gap:14px;align-items:center}.lbl{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--nta-muted-light);text-transform:uppercase;white-space:nowrap}.mono{font-size:10px;color:var(--nta-muted)}.mk{position:relative;background:var(--nta-navy);display:flex;align-items:center;justify-content:center;flex:0 0 auto}.mk span{font-family:var(--font-display);font-weight:700;color:#fff;line-height:1}.t1,.t2{position:absolute}.desc{font-weight:600;letter-spacing:var(--track-descriptor);white-space:nowrap}.nm{font-weight:500;letter-spacing:var(--track-name);white-space:nowrap;color:var(--nta-muted)}.wm{font-family:var(--font-display);font-weight:600;letter-spacing:var(--track-wordmark);color:var(--nta-navy);line-height:1;white-space:nowrap}</style></head><body><div class="w"><div class="row" style="gap:30px;align-items:flex-end"><div style="display:flex;flex-direction:column;align-items:center;gap:9px"><div class="mk" style="width:88px;height:88px;background:var(--nta-navy)"><span style="font-size:28.16px;color:#fff;letter-spacing:.5px">NTA</span><span class="t1" style="top:7.48px;right:7.48px;width:10.120000000000001px;height:10.120000000000001px;border-top:2px solid var(--nta-gold);border-right:2px solid var(--nta-gold)"></span><span class="t2" style="bottom:7.48px;left:7.48px;width:10.120000000000001px;height:10.120000000000001px;border-bottom:2px solid var(--nta-gold);border-left:2px solid var(--nta-gold)"></span></div><span class="mono">88px +</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:9px"><div class="mk" style="width:48px;height:48px;background:var(--nta-navy)"><span style="font-size:15.36px;color:#fff;letter-spacing:.5px">NTA</span><span class="t1" style="top:4.08px;right:4.08px;width:5.5200000000000005px;height:5.5200000000000005px;border-top:1px solid var(--nta-gold);border-right:1px solid var(--nta-gold)"></span><span class="t2" style="bottom:4.08px;left:4.08px;width:5.5200000000000005px;height:5.5200000000000005px;border-bottom:1px solid var(--nta-gold);border-left:1px solid var(--nta-gold)"></span></div><span class="mono">32–48</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:9px"><div class="mk" style="width:28px;height:28px;background:var(--nta-navy)"><span style="font-size:8.96px;color:#fff;letter-spacing:.5px">NTA</span></div><span class="mono">17–31</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:9px"><div class="mk" style="width:16px;height:16px;background:var(--nta-navy)"><span style="font-size:8.96px;color:#fff;letter-spacing:0">N</span></div><span class="mono">16px</span></div></div><span class="mono">Full lockup never below 120px wide — use stacked or the mark.</span></div></body></html>
