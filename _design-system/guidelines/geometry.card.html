<!-- @dsCard group="Spacing" viewport="700x160" subtitle="Square corners; radius only for avatars and the app icon" name="Geometry" --><!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;background:var(--nta-white);font-family:var(--font-text)}.w{padding:22px 26px;display:flex;flex-direction:column;gap:16px}.row{display:flex;gap:14px;align-items:center}.lbl{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--nta-muted-light);text-transform:uppercase;white-space:nowrap}.mono{font-size:10px;color:var(--nta-muted)}.mk{position:relative;background:var(--nta-navy);display:flex;align-items:center;justify-content:center;flex:0 0 auto}.mk span{font-family:var(--font-display);font-weight:700;color:#fff;line-height:1}.t1,.t2{position:absolute}.desc{font-weight:600;letter-spacing:var(--track-descriptor);white-space:nowrap}.nm{font-weight:500;letter-spacing:var(--track-name);white-space:nowrap;color:var(--nta-muted)}.wm{font-family:var(--font-display);font-weight:600;letter-spacing:var(--track-wordmark);color:var(--nta-navy);line-height:1;white-space:nowrap}</style></head><body><div class="w"><div class="row" style="gap:30px"><div style="display:flex;flex-direction:column;align-items:center;gap:9px"><div style="width:60px;height:60px;background:var(--nta-navy)"></div><span class="mono">0 · default</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:9px"><div style="width:60px;height:60px;background:var(--nta-navy);border-radius:10px"></div><span class="mono">10px · app icon</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:9px"><div style="width:60px;height:60px;background:var(--nta-navy);border-radius:50%"></div><span class="mono">50% · avatar</span></div><div style="display:flex;flex-direction:column;justify-content:center;gap:7px;flex:1"><span class="lbl">Clear space</span><span class="mono" style="line-height:1.6">½ × mark height on all sides of any lockup.</span></div></div></div></body></html>
