<!-- @dsCard group="Type" viewport="700x190" subtitle="Archivo — body, UI, and every descriptor" name="Text · Archivo" --><!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;background:var(--nta-white);font-family:var(--font-text)}.w{padding:22px 26px;display:flex;flex-direction:column;gap:16px}.row{display:flex;gap:14px;align-items:center}.lbl{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--nta-muted-light);text-transform:uppercase;white-space:nowrap}.mono{font-size:10px;color:var(--nta-muted)}.mk{position:relative;background:var(--nta-navy);display:flex;align-items:center;justify-content:center;flex:0 0 auto}.mk span{font-family:var(--font-display);font-weight:700;color:#fff;line-height:1}.t1,.t2{position:absolute}.desc{font-weight:600;letter-spacing:var(--track-descriptor);white-space:nowrap}.nm{font-weight:500;letter-spacing:var(--track-name);white-space:nowrap;color:var(--nta-muted)}.wm{font-family:var(--font-display);font-weight:600;letter-spacing:var(--track-wordmark);color:var(--nta-navy);line-height:1;white-space:nowrap}</style></head><body><div class="w"><div style="border-top:3px solid var(--nta-gold);padding-top:16px;display:flex;flex-direction:column;gap:10px"><span style="font-weight:800;font-size:52px;color:var(--nta-navy);line-height:1">Aa</span><span style="font-size:15px;color:var(--nta-body);line-height:1.6">Body copy, forms, navigation, tables, and every descriptor in the logo system.</span><span class="mono">400 · 500 · 600 · 700 · 800. Precision and clarity.</span></div></div></body></html>
