<!-- @dsCard group="Colors" viewport="700x200" subtitle="Gold is an accent — never text on a light field" name="Contrast rules" --><!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;background:var(--nta-white);font-family:var(--font-text)}.w{padding:22px 26px;display:flex;flex-direction:column;gap:16px}.row{display:flex;gap:14px;align-items:center}.lbl{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--nta-muted-light);text-transform:uppercase;white-space:nowrap}.mono{font-size:10px;color:var(--nta-muted)}.mk{position:relative;background:var(--nta-navy);display:flex;align-items:center;justify-content:center;flex:0 0 auto}.mk span{font-family:var(--font-display);font-weight:700;color:#fff;line-height:1}.t1,.t2{position:absolute}.desc{font-weight:600;letter-spacing:var(--track-descriptor);white-space:nowrap}.nm{font-weight:500;letter-spacing:var(--track-name);white-space:nowrap;color:var(--nta-muted)}.wm{font-family:var(--font-display);font-weight:600;letter-spacing:var(--track-wordmark);color:var(--nta-navy);line-height:1;white-space:nowrap}</style></head><body><div class="w"><div class="row" style="gap:16px;align-items:stretch"><div style="flex:1;border-left:3px solid var(--nta-success);padding:12px 16px;background:var(--nta-paper)"><div class="lbl" style="color:var(--nta-success);margin-bottom:11px">Passes AA</div><div style="background:var(--nta-navy);padding:7px 10px;margin-bottom:8px"><span style="font-size:11px;font-weight:600;color:var(--nta-gold)">Gold on navy · 5.1:1</span></div><div style="font-size:11px;font-weight:600;color:var(--nta-navy);margin-bottom:6px">Navy on white · 11.8:1</div><div style="font-size:11px;font-weight:600;color:var(--nta-gold-deep)">Deep Gold on white · 4.6:1</div></div><div style="flex:1;border-left:3px solid var(--nta-danger);padding:12px 16px;background:var(--nta-paper)"><div class="lbl" style="color:var(--nta-danger);margin-bottom:11px">Never</div><div style="font-size:11px;font-weight:600;color:var(--nta-gold);margin-bottom:8px">Gold text on white · 2.3:1</div><div style="background:var(--nta-navy);padding:7px 10px;margin-bottom:8px"><span style="font-size:11px;font-weight:600;color:var(--nta-slate)">Slate on navy · 1.9:1</span></div><div style="background:var(--nta-gold);padding:7px 10px"><span style="font-size:11px;font-weight:600;color:#fff">White on gold · 2.1:1</span></div></div></div></div></body></html>
