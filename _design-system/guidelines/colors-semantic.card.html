<!-- @dsCard group="Colors" viewport="700x150" subtitle="Prefer these aliases in components" name="Semantic tokens" --><!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;background:var(--nta-white);font-family:var(--font-text)}.w{padding:22px 26px;display:flex;flex-direction:column;gap:16px}.row{display:flex;gap:14px;align-items:center}.lbl{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--nta-muted-light);text-transform:uppercase;white-space:nowrap}.mono{font-size:10px;color:var(--nta-muted)}.mk{position:relative;background:var(--nta-navy);display:flex;align-items:center;justify-content:center;flex:0 0 auto}.mk span{font-family:var(--font-display);font-weight:700;color:#fff;line-height:1}.t1,.t2{position:absolute}.desc{font-weight:600;letter-spacing:var(--track-descriptor);white-space:nowrap}.nm{font-weight:500;letter-spacing:var(--track-name);white-space:nowrap;color:var(--nta-muted)}.wm{font-family:var(--font-display);font-weight:600;letter-spacing:var(--track-wordmark);color:var(--nta-navy);line-height:1;white-space:nowrap}</style></head><body><div class="w"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 26px"><div class="row" style="gap:9px"><span style="width:15px;height:15px;background:var(--text-heading);border:1px solid var(--nta-line);flex:0 0 auto"></span><span class="mono" style="font-size:10.5px"><strong style="color:var(--nta-navy)">--text-heading</strong> · Navy</span></div><div class="row" style="gap:9px"><span style="width:15px;height:15px;background:var(--text-body);border:1px solid var(--nta-line);flex:0 0 auto"></span><span class="mono" style="font-size:10.5px"><strong style="color:var(--nta-navy)">--text-body</strong> · Body slate</span></div><div class="row" style="gap:9px"><span style="width:15px;height:15px;background:var(--text-muted);border:1px solid var(--nta-line);flex:0 0 auto"></span><span class="mono" style="font-size:10.5px"><strong style="color:var(--nta-navy)">--text-muted</strong> · Muted grey</span></div><div class="row" style="gap:9px"><span style="width:15px;height:15px;background:var(--surface-sunken);border:1px solid var(--nta-line);flex:0 0 auto"></span><span class="mono" style="font-size:10.5px"><strong style="color:var(--nta-navy)">--surface-sunken</strong> · Paper</span></div><div class="row" style="gap:9px"><span style="width:15px;height:15px;background:var(--accent);border:1px solid var(--nta-line);flex:0 0 auto"></span><span class="mono" style="font-size:10.5px"><strong style="color:var(--nta-navy)">--accent</strong> · Gold</span></div><div class="row" style="gap:9px"><span style="width:15px;height:15px;background:var(--accent-text);border:1px solid var(--nta-line);flex:0 0 auto"></span><span class="mono" style="font-size:10.5px"><strong style="color:var(--nta-navy)">--accent-text</strong> · Deep Gold</span></div><div class="row" style="gap:9px"><span style="width:15px;height:15px;background:var(--link);border:1px solid var(--nta-line);flex:0 0 auto"></span><span class="mono" style="font-size:10.5px"><strong style="color:var(--nta-navy)">--link</strong> · Slate Blue</span></div><div class="row" style="gap:9px"><span style="width:15px;height:15px;background:var(--border-hairline);border:1px solid var(--nta-line);flex:0 0 auto"></span><span class="mono" style="font-size:10.5px"><strong style="color:var(--nta-navy)">--border-hairline</strong> · Line</span></div></div></div></body></html>
