<!-- @dsCard group="Brand" viewport="700x260" subtitle="Charcoal-ground headshot — sits on navy or paper, never cropped circular below 96px" name="Portrait treatment" --><!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;background:var(--nta-white);font-family:var(--font-text)}.w{padding:22px 26px;display:flex;flex-direction:column;gap:16px}.row{display:flex;gap:14px;align-items:center}.lbl{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--nta-muted-light);text-transform:uppercase;white-space:nowrap}.mono{font-size:10px;color:var(--nta-muted)}.mk{position:relative;background:var(--nta-navy);display:flex;align-items:center;justify-content:center;flex:0 0 auto}.mk span{font-family:var(--font-display);font-weight:700;color:#fff;line-height:1}.t1,.t2{position:absolute}.desc{font-weight:600;letter-spacing:var(--track-descriptor);white-space:nowrap}.nm{font-weight:500;letter-spacing:var(--track-name);white-space:nowrap;color:var(--nta-muted)}.wm{font-family:var(--font-display);font-weight:600;letter-spacing:var(--track-wordmark);color:var(--nta-navy);line-height:1;white-space:nowrap}</style></head><body><div class="w"><div class="row" style="gap:24px;align-items:stretch"><img src="../assets/nicholas-avello-headshot.png" alt="Nicholas T. Avello, CPA" style="width:150px;height:190px;object-fit:cover;object-position:50% 18%;flex:0 0 auto"><div style="width:1px;background:var(--nta-line)"></div><img src="../assets/nicholas-avello-headshot.png" alt="" style="width:110px;height:110px;border-radius:50%;object-fit:cover;object-position:50% 15%;flex:0 0 auto;align-self:center"><div style="display:flex;flex-direction:column;justify-content:center;gap:8px;flex:1"><span class="lbl">Square crop · circular crop</span><span class="mono" style="line-height:1.6">Charcoal ground reads as an extension of Navy. Keep the eyeline in the upper third; do not tint, duotone, or apply the gold as an overlay.</span></div></div></div></body></html>
