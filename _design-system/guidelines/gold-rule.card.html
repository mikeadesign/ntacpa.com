<!-- @dsCard group="Brand" viewport="700x150" subtitle="The signature divider — vertical hinge, horizontal bridge" name="Gold rule" --><!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;background:var(--nta-white);font-family:var(--font-text)}.w{padding:22px 26px;display:flex;flex-direction:column;gap:16px}.row{display:flex;gap:14px;align-items:center}.lbl{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--nta-muted-light);text-transform:uppercase;white-space:nowrap}.mono{font-size:10px;color:var(--nta-muted)}.mk{position:relative;background:var(--nta-navy);display:flex;align-items:center;justify-content:center;flex:0 0 auto}.mk span{font-family:var(--font-display);font-weight:700;color:#fff;line-height:1}.t1,.t2{position:absolute}.desc{font-weight:600;letter-spacing:var(--track-descriptor);white-space:nowrap}.nm{font-weight:500;letter-spacing:var(--track-name);white-space:nowrap;color:var(--nta-muted)}.wm{font-family:var(--font-display);font-weight:600;letter-spacing:var(--track-wordmark);color:var(--nta-navy);line-height:1;white-space:nowrap}</style></head><body><div class="w"><div class="row" style="gap:40px"><div class="row" style="gap:16px"><span style="width:2px;height:64px;background:var(--nta-gold)"></span><span class="lbl">Vertical · 2px</span></div><div style="display:flex;flex-direction:column;gap:10px;align-items:flex-start"><span style="width:120px;height:2px;background:var(--nta-gold)"></span><span class="lbl">Horizontal bridge</span></div><div style="display:flex;flex-direction:column;gap:10px;align-items:flex-start"><span style="width:120px;height:3px;background:var(--nta-gold)"></span><span class="lbl">Card accent · 3px</span></div></div></div></body></html>
