<!-- @dsCard group="Brand" viewport="700x230" subtitle="Header lockup — descriptor lines drop, name still reads" name="Logo · compact" --><!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;font-family:var(--font-text)}.w{padding:22px 26px;display:flex;flex-direction:column;gap:18px}.lbl{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--nta-muted-light);text-transform:uppercase;white-space:nowrap}.mk{position:relative;display:flex;align-items:center;justify-content:center;flex:0 0 auto}.mk span{font-family:var(--font-display);font-weight:700;line-height:1}.t{position:absolute}.wm{font-family:var(--font-display);font-weight:600;letter-spacing:var(--track-wordmark);line-height:1;white-space:nowrap}.note{font-size:10.5px;line-height:1.6}</style></head><body><div class="w" style="background:var(--nta-white)">

  <div class="t" style="top:4.8px;right:4.8px;width:6.4px;height:6.4px;border-top:1px solid var(--nta-gold);border-right:1px solid var(--nta-gold)"></div>

  <div style="width:2px;height:56px;background:var(--nta-gold);flex:0 0 auto"></div>
  <div class="wm" style="font-size:19.6px;color:var(--nta-navy)">NTA, Inc.</div>
</div></div>
    <div style="display:flex;flex-direction:column;gap:10px"><div class="lbl">40px mark</div><div style="display:flex;align-items:center;gap:9.8px">
